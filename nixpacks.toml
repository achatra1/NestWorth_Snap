[phases.setup]
nixPkgs = ["python311", "stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install -r backend/requirements.txt"
]

[start]
cmd = "export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/root/.nix-profile/lib && . /opt/venv/bin/activate && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
